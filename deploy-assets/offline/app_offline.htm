<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Maintenance - CBS Bangladesh</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 100px 20px;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }
    h1 {
      color: #38bdf8;
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    p {
      color: #94a3b8;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .spinner {
      margin: 24px auto 0;
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .badge {
      display: inline-block;
      margin-top: 24px;
      font-size: 0.8rem;
      color: #64748b;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CBS Core Banking System</h1>
    <p>The system is currently undergoing a scheduled rolling release upgrade. Core transaction engines will be available momentarily.</p>
    <div class="spinner"></div>
    <div class="badge">Compliance: Bangladesh Bank BRPD Circular 12</div>
  </div>
</body>
</html>
