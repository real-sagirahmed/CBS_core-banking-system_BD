# ==============================================================================
# CBS Bangladesh Core Banking System - NGINX Hardened Reverse Proxy Config
# Conforming to Bangladesh Bank BRPD Circular No. 12 (13 May 2024)
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with request timing and upstream response time
    log_format  banking_audit  '$remote_addr - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" '
                               '"$http_user_agent" "$http_x_forwarded_for" '
                               'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  banking_audit;

    # Performance Optimizations
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off; # Hide NGINX version banner for security

    # Request Rate Limiting (100 requests/second per IP with burst capacity of 50)
    limit_req_zone $binary_remote_addr zone=banking_api_limit:20m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=banking_conn_limit:20m;

    # Gzip Compression for JSON APIs & static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream CBS API Service Pool
    upstream cbs_api_upstream {
        server cbs-api:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Client body limit (Max 15MB for scanned documents, L/C instruments, and KYC artifacts)
        client_max_body_size 15M;
        client_body_timeout 15s;
        client_header_timeout 15s;

        # Banking Security Headers (BRPD 10.3.5 & OWASP API Top 10)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Health Probe Endpoint (Bypasses rate limiting for Docker/K8s liveness probes)
        location /health {
            proxy_pass http://cbs_api_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        location /health/ready {
            proxy_pass http://cbs_api_upstream/health/ready;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        location /health/live {
            proxy_pass http://cbs_api_upstream/health/live;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # Core Banking APIs & Static Frontend
        location / {
            # Enforce Connection and Rate Limits
            limit_req zone=banking_api_limit burst=50 nodelay;
            limit_conn banking_conn_limit 50;

            proxy_pass http://cbs_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Forwarded Headers for Audit Trails & Single Sign-On IP Validation
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
