name: CBS Core Banking - MonsterASP.NET Production CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-monsterasp-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Quality & Automated Verification Gates
  # ----------------------------------------------------------------------------
  verify-and-test:
    name: Security & Solution Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore CBS.sln

      - name: Compile Solution (Release Mode)
        run: dotnet build CBS.sln --configuration Release --no-restore

      - name: Run Domain Unit Tests
        run: |
          dotnet test tests/CBS.Domain.UnitTests/CBS.Domain.UnitTests.csproj \
            --configuration Release \
            --no-build

      - name: Run Architecture Invariant Tests
        run: |
          dotnet test tests/CBS.ArchitectureTests/CBS.ArchitectureTests.csproj \
            --configuration Release \
            --no-build

  # ----------------------------------------------------------------------------
  # Stage 2: Publish, Configure & Deploy to MonsterASP.NET
  # ----------------------------------------------------------------------------
  deploy-to-monsterasp:
    name: Publish & Deploy to MonsterASP.NET
    needs: [verify-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Web API (Framework-Dependent Release)
        run: |
          dotnet publish src/CBS.Api/CBS.Api.csproj \
            --configuration Release \
            --output ./publish \
            --no-self-contained

      - name: Generate Production Configuration (appsettings.Production.json)
        run: |
          cat << 'EOF' > ./publish/appsettings.Production.json
          {
            "ConnectionStrings": {
              "PostgreSql": "${{ secrets.MONSTERASP_POSTGRES_CONNECTION_STRING }}"
            },
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*"
          }
          EOF

      - name: Detect Remote Server Directory Layout
        id: detect-dir
        env:
          FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: |
          echo "Checking FTP root directory structure..."
          LISTING=$(curl -k --ftp-ssl -s -l -u "${FTP_USER}:${FTP_PASS}" "ftp://${FTP_SERVER}:21/" || true)
          echo "FTP Root Listing:"
          echo "$LISTING"
          
          if echo "$LISTING" | grep -q "^site$"; then
            echo "TARGET_DIR=site/wwwroot/" >> $GITHUB_ENV
          elif echo "$LISTING" | grep -q "^wwwroot$"; then
            echo "TARGET_DIR=wwwroot/" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=site/wwwroot/" >> $GITHUB_ENV
          fi

      - name: Enable IIS app_offline.htm (Graceful File-Lock Release)
        env:
          FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: |
          echo "Placing IIS site into offline mode via ${TARGET_DIR}app_offline.htm to release file locks..."
          curl -k --ftp-ssl --ftp-create-dirs -T deploy-assets/offline/app_offline.htm \
            -u "${FTP_USER}:${FTP_PASS}" \
            "ftp://${FTP_SERVER}:21/${TARGET_DIR}app_offline.htm" || echo "Note: Initial upload completed."

      - name: Sync Application Payload to MonsterASP.NET via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTERASP_FTP_SERVER }}
          username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          server-dir: ${{ env.TARGET_DIR }}
          local-dir: ./publish/
          dangerous-clean-slate: false

      - name: Remove app_offline.htm (Bring CBS Application Online)
        env:
          FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: |
          echo "Removing app_offline.htm to start ASP.NET Core process..."
          curl -k --ftp-ssl -u "${FTP_USER}:${FTP_PASS}" \
            -Q "DELE /${TARGET_DIR}app_offline.htm" \
            "ftp://${FTP_SERVER}:21/" || echo "app_offline.htm already cleared or not present."

      - name: Post-Deployment Smoke Test & Health Probes
        run: |
          echo "=================================================================="
          echo "Verifying CBS Production Deployment Health: http://cbsbd.runasp.net"
          echo "=================================================================="
          max_retries=20
          count=0
          until [ $count -ge $max_retries ]
          do
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" http://cbsbd.runasp.net/health/ready || true)
            if [ "$STATUS" -eq 200 ]; then
              echo ">>> SUCCESS: CBS Core Banking is LIVE and PostgreSQL is CONNECTED (HTTP 200)!"
              curl -s -L http://cbsbd.runasp.net/health/ready
              echo ""
              exit 0
            fi
            echo "Health probe returned HTTP $STATUS. Waiting 6 seconds (attempt $((count+1))/$max_retries)..."
            count=$((count+1))
            sleep 6
          done
          echo ">>> ERROR: CBS Deployment verification failed. /health/ready did not return HTTP 200 within timeout."
          exit 1
