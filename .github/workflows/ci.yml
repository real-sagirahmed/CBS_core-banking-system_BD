name: CBS Core Banking - Enterprise CI/CD & Automated Production Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: SAST Security Auditing & Dependency Vulnerability Screening
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Audit NuGet Package Vulnerabilities
        run: |
          echo "================================================================="
          echo "Screening NuGet Dependencies for Known CVEs & Security Advisories"
          echo "================================================================="
          dotnet list package --vulnerable --include-transitive || echo "Advisory scan completed with findings."

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ----------------------------------------------------------------------------
  # Job 2: Solution Build & Solution-Wide Automated Verification Suite
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Build & Solution Test Suite (375+ Tests)
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore CBS.sln

      - name: Compile Solution (Release Mode)
        run: dotnet build CBS.sln --configuration Release --no-restore

      - name: Run Domain Unit Tests (259 Tests)
        run: |
          dotnet test tests/CBS.Domain.UnitTests/CBS.Domain.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=domain-unit-tests.trx" \
            --results-directory ./TestResults

      - name: Run Architecture Invariant Tests (1 Test)
        run: |
          dotnet test tests/CBS.ArchitectureTests/CBS.ArchitectureTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=architecture-tests.trx" \
            --results-directory ./TestResults

      # ------------------------------------------------------------------------
      # Install Playwright browser & Linux OS dependencies for headless testing
      # ------------------------------------------------------------------------
      - name: Install Playwright Browsers & OS Dependencies
        run: |
          pwsh tests/CBS.PlaywrightTests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright & E2E Integration Tests (115 Tests)
        run: |
          dotnet test tests/CBS.PlaywrightTests/CBS.PlaywrightTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=playwright-tests.trx" \
            --results-directory ./TestResults

      - name: Run High-Load Concurrency & Stress Tests (5 Tests)
        run: |
          dotnet test tests/CBS.StressTests/CBS.StressTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=stress-tests.trx" \
            --results-directory ./TestResults

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbs-test-results
          path: ./TestResults/*.trx
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Job 3: Production Docker Container Packaging Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Containerization Build & Validation
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Multi-Stage Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cbs-core-banking-system:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate NGINX Reverse Proxy Configuration
        run: |
          docker run --rm -v ${{ github.workspace }}/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.27-alpine nginx -t

  # ----------------------------------------------------------------------------
  # Job 4: Continuous Deployment to MonsterASP.NET (Production)
  # ----------------------------------------------------------------------------
  deploy-production:
    name: Production Deployment to MonsterASP.NET
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Web API (Framework-Dependent Release)
        run: |
          dotnet publish src/CBS.Api/CBS.Api.csproj \
            --configuration Release \
            --output ./publish \
            --no-self-contained

      - name: Generate Production Configuration (appsettings.Production.json)
        run: |
          cat << 'EOF' > ./publish/appsettings.Production.json
          {
            "ConnectionStrings": {
              "PostgreSql": "${{ secrets.MONSTERASP_POSTGRES_CONNECTION_STRING }}"
            },
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*"
          }
          EOF

      - name: Detect Remote Server Directory Layout
        id: detect-dir
        env:
          FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: |
          echo "Checking FTP root directory structure..."
          LISTING=$(curl -k --ftp-ssl -s -l -u "${FTP_USER}:${FTP_PASS}" "ftp://${FTP_SERVER}:21/" || true)
          echo "FTP Root Listing:"
          echo "$LISTING"
          
          if echo "$LISTING" | grep -q "^site$"; then
            echo "TARGET_DIR=site/wwwroot/" >> $GITHUB_ENV
          elif echo "$LISTING" | grep -q "^wwwroot$"; then
            echo "TARGET_DIR=wwwroot/" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=site/wwwroot/" >> $GITHUB_ENV
          fi

      - name: Enable IIS app_offline.htm (Graceful File-Lock Release)
        env:
          FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: |
          echo "Placing IIS site into offline mode via ${TARGET_DIR}app_offline.htm to release file locks..."
          curl -k --ftp-ssl --ftp-create-dirs -T deploy-assets/offline/app_offline.htm \
            -u "${FTP_USER}:${FTP_PASS}" \
            "ftp://${FTP_SERVER}:21/${TARGET_DIR}app_offline.htm" || echo "Note: Initial upload completed."

      - name: Sync Application Payload to MonsterASP.NET via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTERASP_FTP_SERVER }}
          username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          server-dir: ${{ env.TARGET_DIR }}
          local-dir: ./publish/
          dangerous-clean-slate: false

      - name: Remove app_offline.htm (Bring CBS Application Online)
        env:
          FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: |
          echo "Removing app_offline.htm to start ASP.NET Core process..."
          curl -k --ftp-ssl -u "${FTP_USER}:${FTP_PASS}" \
            -Q "DELE /${TARGET_DIR}app_offline.htm" \
            "ftp://${FTP_SERVER}:21/" || echo "app_offline.htm already cleared or not present."

      - name: Post-Deployment Smoke Test & Health Probes
        run: |
          echo "=================================================================="
          echo "Verifying CBS Production Deployment Health: http://cbsbd.runasp.net"
          echo "=================================================================="
          max_retries=20
          count=0
          until [ $count -ge $max_retries ]
          do
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" http://cbsbd.runasp.net/health/ready || true)
            if [ "$STATUS" -eq 200 ]; then
              echo ">>> SUCCESS: CBS Core Banking is LIVE and PostgreSQL is CONNECTED (HTTP 200)!"
              curl -s -L http://cbsbd.runasp.net/health/ready
              echo ""
              exit 0
            fi
            echo "Health probe returned HTTP $STATUS. Waiting 6 seconds (attempt $((count+1))/$max_retries)..."
            count=$((count+1))
            sleep 6
          done
          echo ">>> ERROR: CBS Deployment verification failed. /health/ready did not return HTTP 200 within timeout."
          exit 1
