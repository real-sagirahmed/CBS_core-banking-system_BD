name: CBS Core Banking - Enterprise CI/CD & Automated Security Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: SAST Security Auditing & Dependency Vulnerability Screening
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Audit NuGet Package Vulnerabilities
        run: |
          echo "================================================================="
          echo "Screening NuGet Dependencies for Known CVEs & Security Advisories"
          echo "================================================================="
          dotnet list package --vulnerable --include-transitive || echo "Advisory scan completed with findings."

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ----------------------------------------------------------------------------
  # Job 2: Solution Build & Solution-Wide Automated Verification Suite
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Build & Solution Test Suite (375+ Tests)
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore CBS.sln

      - name: Compile Solution (Release Mode)
        run: dotnet build CBS.sln --configuration Release --no-restore

      - name: Run Domain Unit Tests (259 Tests)
        run: |
          dotnet test tests/CBS.Domain.UnitTests/CBS.Domain.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=domain-unit-tests.trx" \
            --results-directory ./TestResults

      - name: Run Architecture Invariant Tests (1 Test)
        run: |
          dotnet test tests/CBS.ArchitectureTests/CBS.ArchitectureTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=architecture-tests.trx" \
            --results-directory ./TestResults

      - name: Run Playwright & E2E Integration Tests (115 Tests)
        run: |
          dotnet test tests/CBS.PlaywrightTests/CBS.PlaywrightTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=playwright-tests.trx" \
            --results-directory ./TestResults

      - name: Run High-Load Concurrency & Stress Tests (5 Tests)
        run: |
          dotnet test tests/CBS.StressTests/CBS.StressTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=stress-tests.trx" \
            --results-directory ./TestResults

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbs-test-results
          path: ./TestResults/*.trx
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Job 3: Production Docker Container Packaging Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Containerization Build & Validation
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Multi-Stage Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cbs-core-banking-system:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate NGINX Reverse Proxy Configuration
        run: |
          docker run --rm -v ${{ github.workspace }}/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.27-alpine nginx -t
